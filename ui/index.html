<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HearSec Assessment Dashboard</title>
<style>
body{font-family:Inter,system-ui,sans-serif;margin:0;background:#0b1020;color:#eef2ff}header{padding:28px 6%;background:#111936;border-bottom:1px solid #293458}h1{margin:0 0 6px}main{max-width:1100px;margin:auto;padding:28px 6%;display:grid;gap:20px}.card{background:#121a35;border:1px solid #293458;border-radius:16px;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}label{display:block;font-size:13px;color:#aeb9d9;margin-bottom:6px}input,select,textarea{width:100%;box-sizing:border-box;background:#0b1020;color:#fff;border:1px solid #354267;border-radius:9px;padding:10px}textarea{min-height:90px}button{border:0;border-radius:10px;padding:11px 16px;background:#6d7cff;color:white;font-weight:700;cursor:pointer}.finding{border-left:4px solid #6d7cff;padding:12px;margin:12px 0;background:#0e1630}.muted{color:#aeb9d9}.risk{font-weight:800}.actions{display:flex;gap:10px;flex-wrap:wrap}pre{white-space:pre-wrap;overflow:auto;background:#080c18;padding:14px;border-radius:10px}
</style></head><body><header><h1>HearSec</h1><div class="muted">Connected Hearing Technology Security Assessment</div></header>
<main>
<section class="card"><h2>1. Target & authorization</h2><div class="grid">
<div><label>Device type</label><input id="device" placeholder="Hearing aid"></div><div><label>Model</label><input id="model"></div><div><label>Firmware</label><input id="firmware"></div><div><label>Companion app</label><input id="app"></div><div><label>App version</label><input id="appver"></div><div><label>Platform</label><input id="platform" placeholder="Android / iOS"></div></div><p><label>Authorized scope</label><textarea id="auth" placeholder="Describe the equipment/app/environment you are authorized to assess."></textarea></p></section>
<section class="card"><h2>2. Data flow</h2><div class="grid"><input id="src" placeholder="Source"><input id="dst" placeholder="Destination"><input id="cat" placeholder="Data category"><input id="prot" placeholder="Observed protection"></div><br><button onclick="addFlow()">Add flow</button><div id="flows"></div></section>
<section class="card"><h2>3. Finding</h2><div class="grid"><input id="fid" placeholder="F-001"><input id="ftitle" placeholder="Finding title"><select id="lik"><option value="1">Likelihood 1</option><option value="2">Likelihood 2</option><option value="3" selected>Likelihood 3</option><option value="4">Likelihood 4</option><option value="5">Likelihood 5</option></select><select id="impact"><option value="1">Impact 1</option><option value="2">Impact 2</option><option value="3" selected>Impact 3</option><option value="4">Impact 4</option><option value="5">Impact 5</option></select></div><p><textarea id="evidence" placeholder="Evidence observed or documented"></textarea></p><p><textarea id="rec" placeholder="Recommended mitigation"></textarea></p><button onclick="addFinding()">Add finding</button><div id="findings"></div></section>
<section class="card"><h2>4. Assessment output</h2><div class="actions"><button onclick="generate()">Generate JSON</button><button onclick="downloadJSON()">Download JSON</button></div><pre id="out">Build the assessment, then generate the structured output.</pre></section>
</main>
<script>
let flows=[],findings=[],last=null;
function addFlow(){flows.push({source:src.value,destination:dst.value,data_category:cat.value,protection:prot.value});['src','dst','cat','prot'].forEach(x=>document.getElementById(x).value='');render()}
function addFinding(){let l=+lik.value,i=+impact.value,s=l*i,level=s>=20?'critical':s>=15?'high':s>=8?'medium':s>=4?'low':'informational';findings.push({id:fid.value||'F-'+String(findings.length+1).padStart(3,'0'),category:'security/privacy',title:ftitle.value,evidence:evidence.value,risk:{likelihood:String(l),impact:String(i),level},recommendation:rec.value});['fid','ftitle','evidence','rec'].forEach(x=>document.getElementById(x).value='');render()}
function render(){flowsEl.innerHTML=flows.map((f,i)=>'<div class="finding"><b>Flow '+(i+1)+'</b> — '+f.source+' → '+f.destination+'<br><span class="muted">'+f.data_category+' · '+f.protection+'</span></div>').join('');findingsEl.innerHTML=findings.map(f=>'<div class="finding"><b>'+f.id+' · '+f.title+'</b><br>Risk: <span class="risk">'+f.risk.level.toUpperCase()+'</span> ('+f.risk.likelihood+' × '+f.risk.impact+')</div>').join('')}
function generate(){last={assessment_id:'HS-'+Date.now(),date:new Date().toISOString().slice(0,10),authorization:{scope:auth.value},target:{device_type:device.value,model:model.value,firmware:firmware.value,companion_app:app.value,app_version:appver.value,platform:platform.value},data_flows:flows,findings};out.textContent=JSON.stringify(last,null,2)}
function downloadJSON(){if(!last)generate();let b=new Blob([JSON.stringify(last,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=last.assessment_id+'.json';a.click()}
const flowsEl=document.getElementById('flows'),findingsEl=document.getElementById('findings'),out=document.getElementById('out');
</script></body></html>
