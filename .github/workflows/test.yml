name: HearSec Tests
on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. pytest -q
      - run: python -m assessment assessment/example_assessment.json > /tmp/hearsec-demo-report.md
